services:
  comfyui:
    # Runtime storage is kept in compose.storage.yaml so model paths can be
    # customized without editing worker, GPU, or network configuration.
    extends:
      file: compose.storage.yaml
      service: worker-storage
    build:
      context: .
      dockerfile: Dockerfile
    container_name: animagine-comfyui
    restart: unless-stopped

    # Public default: the first NVIDIA device. Override COMFYUI_GPU_DEVICE in
    # .env with an index or NVIDIA device identifier on multi-GPU hosts.
    devices:
      - nvidia.com/gpu=${COMFYUI_GPU_DEVICE:-0}

    ports:
      - "18188:8188"

    environment:
      - NVIDIA_VISIBLE_DEVICES=${COMFYUI_GPU_DEVICE:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Read from this project's .env; the value is not baked into the image.
      - CIVITAI_API_KEY=${CIVITAI_API_KEY}

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
